<!-- Inclusive Disability Support IMS - Kamonyi District -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Disability Support IMS · Kamonyi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
  :root{
    --bg:#eff8ff; --surface:#ffffff; --surface-2:#f5fbff; --surface-3:#e4f3fd;
    --border:#d3e9f8; --border-2:#b6dbf3;
    --text:#0b2a3f; --muted:#4d6d84; --muted-2:#7d9bb0;
    --sky:#0284c7; --sky-600:#0369a1; --sky-700:#075985; --sky-soft:#e0f2fe;
    --amber:#b45309; --amber-soft:#fef3c7; --green:#047857; --green-soft:#d1fae5;
    --red:#b91c1c; --red-soft:#fee2e2; --violet:#6d28d9; --violet-soft:#ede9fe;
    --radius:16px; --shadow:0 10px 30px -14px rgba(2,132,199,.35); --focus:#0284c7;
  }
  /* high-contrast mode (WCAG 1.4.3 / user preference) */
  body.hc{--bg:#000;--surface:#0a0a0a;--surface-2:#141414;--surface-3:#1c1c1c;
    --border:#5a5a5a;--border-2:#7a7a7a;--text:#fff;--muted:#e8e8e8;--muted-2:#cfcfcf;
    --sky:#ffd400;--sky-600:#ffd400;--sky-700:#ffe34d;--sky-soft:#332b00;
    --amber:#ffb000;--amber-soft:#332600;--green:#00e676;--green-soft:#052e1a;
    --red:#ff5252;--red-soft:#330d0d;--violet:#c4a3ff;--violet-soft:#1a0d33;
    --focus:#ffd400;--shadow:none}
  body.hc .btn{color:#000}
  body.hc .logo{border:1px solid var(--border-2)}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(1100px 460px at 50% -160px,#bae6fd,transparent 60%),var(--bg);
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  /* visible keyboard focus (WCAG 2.4.7) */
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
  .sky-grad{background:linear-gradient(135deg,#38bdf8,#0369a1)}

  /* 44px minimum touch targets (WCAG 2.5.5) */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;
    background:var(--sky);color:#fff;font-weight:700;font-size:15px;padding:12px 18px;transition:.15s;min-height:44px}
  .btn:hover{background:var(--sky-600)}
  .btn.block{width:100%}
  .btn.sm{padding:9px 14px;font-size:14px;min-height:40px;border-radius:9px}
  .btn.ghost{background:var(--surface);border:1.5px solid var(--border-2);color:var(--sky-700)}
  .btn.ghost:hover{background:var(--sky-soft)}
  .btn.green{background:var(--green)} .btn.amber{background:var(--amber)}
  .btn.red{background:var(--surface);border:1.5px solid var(--red);color:var(--red)}
  .btn.red:hover{background:var(--red-soft)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .login-wrap{min-height:100%;display:flex;flex-direction:column}
  .login-body{flex:1;display:flex;align-items:center;justify-content:center;padding:22px}
  .login-card{width:100%;max-width:470px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:32px 30px;box-shadow:var(--shadow)}
  .logo{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 18px -6px rgba(2,132,199,.9)}
  .login-title{font-size:25px;font-weight:800;margin-top:18px;letter-spacing:-.5px;line-height:1.15}
  .login-sub{color:var(--muted);font-size:15px;margin-top:5px}
  .field{margin-top:16px}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:7px}
  .input{width:100%;background:var(--surface);border:1.5px solid var(--border-2);border-radius:11px;padding:12px 14px;color:var(--text);font-size:15px;transition:.15s}
  .input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-soft)}
  textarea.input{resize:vertical;min-height:88px;line-height:1.5}
  .err{color:var(--red);font-size:14px;margin-top:10px;font-weight:600}
  .demo{margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
  .demo-h{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted-2);margin-bottom:10px;font-weight:700}
  .chip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;transition:.15s;color:var(--text)}
  .chip:hover{border-color:var(--sky);background:var(--sky-soft)}
  .chip-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .chip-t{font-size:14.5px;font-weight:700}.chip-e{font-size:12.5px;color:var(--muted)}

  .a11y{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:8px 16px;background:var(--surface-3);border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:13px}
  .a11y .grp{display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--border-2);border-radius:9px;padding:3px}
  .a11y .lbl{color:var(--muted);font-weight:600}
  .a11y button{background:none;border:none;color:var(--text);font-weight:700;padding:6px 10px;border-radius:6px;min-width:36px;font-size:13px}
  .a11y button.on{background:var(--sky);color:#fff}
  body.hc .a11y button.on{color:#000}
  .a11y button:hover:not(.on){background:var(--sky-soft)}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:13px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-name{font-weight:800;font-size:15px;letter-spacing:-.3px}
  .role-tag{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}
  .spacer{flex:1}
  .who{text-align:right;line-height:1.25}.who-r{font-size:13px;font-weight:700}.who-e{font-size:11.5px;color:var(--muted)}
  .page{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
  .page-h{font-size:23px;font-weight:800;letter-spacing:-.4px}
  .page-sub{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:78ch;line-height:1.5}

  .tabs{display:flex;gap:8px;margin:20px 0 0;flex-wrap:wrap}
  .tab{background:var(--surface);border:1.5px solid var(--border);color:var(--muted);font-size:14px;font-weight:700;padding:10px 15px;border-radius:11px;transition:.15s;display:flex;align-items:center;gap:7px;min-height:42px}
  .tab:hover{border-color:var(--border-2);color:var(--text)}
  .tab.active{background:var(--sky);border-color:var(--sky);color:#fff}
  body.hc .tab.active{color:#000}
  .tab .count{font-size:11.5px;background:rgba(0,0,0,.1);border-radius:10px;padding:1px 7px}
  .tab.active .count{background:rgba(255,255,255,.3)}
  body.hc .tab.active .count{background:rgba(0,0,0,.25)}

  .grid{display:grid;gap:14px;margin-top:22px}
  .g2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:22px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .stat-l{font-size:13px;color:var(--muted);font-weight:600}
  .stat-v{font-size:30px;font-weight:800;margin-top:5px;letter-spacing:-.6px;color:var(--sky-700)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .card-t{font-weight:800;font-size:16px;letter-spacing:-.2px}
  .code{font-family:ui-monospace,monospace;font-weight:700;color:var(--sky-700);font-size:14px}
  .meta{color:var(--muted);font-size:13.5px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;line-height:1.5}
  .meta b{color:var(--text);font-weight:600}
  .rec{margin-top:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 13px;font-size:14px;line-height:1.55}
  .rl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2);margin-bottom:2px}
  .rr+.rl{margin-top:10px}
  .row-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}
  .dot{width:6px;height:6px;border-radius:50%}
  .b-sky{background:var(--sky-soft);color:var(--sky-700)}.b-sky .dot{background:var(--sky)}
  .b-green{background:var(--green-soft);color:var(--green)}.b-green .dot{background:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}.b-amber .dot{background:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}.b-red .dot{background:var(--red)}
  .b-violet{background:var(--violet-soft);color:var(--violet)}.b-violet .dot{background:var(--violet)}
  .b-gray{background:var(--surface-3);color:var(--muted)}.b-gray .dot{background:var(--muted-2)}

  .empty{border:2px dashed var(--border-2);border-radius:var(--radius);padding:40px;text-align:center;color:var(--muted);margin-top:22px;background:var(--surface)}
  .empty b{color:var(--text);display:block;margin-bottom:5px;font-size:16px}
  .form-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:14px}
  .form-grid .full{grid-column:1/-1}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}
  .wg{display:grid;grid-template-columns:1fr 170px 44px;gap:8px;align-items:center;padding:7px 0}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;background:var(--sky-soft);border-radius:11px;padding:12px 13px;font-size:13.5px;line-height:1.5;cursor:pointer}
  .consent input{width:20px;height:20px;margin-top:2px;flex-shrink:0}

  .tl{margin-top:14px;border-left:2px solid var(--border-2);padding-left:16px;display:flex;flex-direction:column;gap:11px}
  .tl-item{position:relative}
  .tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--sky);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--sky-soft)}
  .tl-t{font-size:14px;font-weight:600}.tl-w{font-size:12px;color:var(--muted-2)}

  .opp{border-left:4px solid var(--amber)}
  .opp.job{border-left-color:var(--sky)} .opp.scholarship{border-left-color:var(--violet)} .opp.training{border-left-color:var(--green)}
  .warn{background:var(--red-soft);border:1.5px solid var(--red);border-radius:12px;padding:13px;margin-top:14px;font-size:14px;color:var(--red);line-height:1.5}
  .success{background:var(--green-soft);border:1.5px solid var(--green);border-radius:var(--radius);padding:24px;text-align:center;margin-top:22px}
  .success .big{font-size:36px}
  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:2px solid var(--border)}
  td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  .notif{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--border)}
  .notif-ico{width:36px;height:36px;border-radius:10px;background:var(--sky-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1.5px solid var(--green);color:var(--green);padding:13px 20px;border-radius:12px;font-size:14.5px;font-weight:600;z-index:200;box-shadow:0 20px 40px -15px rgba(0,0,0,.25);max-width:90vw}
  small.hint{color:var(--muted-2);font-size:12.5px;line-height:1.45}
  .bar{height:9px;background:var(--surface-3);border-radius:8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#0369a1);border-radius:8px}
  body.hc .bar>i{background:var(--sky)}
</style>

<div id="root"></div>

<script type="text/babel">
const {useState} = React;

/* ───────── bilingual labels (proposal Table 6: EN + Kinyarwanda) ───────── */
const T = {
  appName:['Disability Support IMS',"Sisitemu y'Ubufasha bw'Abafite Ubumuga"],
  tagline:['Inclusive registry & support coordination · Kamonyi District','Registry irimo bose & guhuza ubufasha · Akarere ka Kamonyi'],
  email:['Email','Imeyili'], password:['Password','Ijambobanga'], login:['Log in','Injira'], logout:['Log out','Sohoka'],
  demo:['Demo accounts (tap to sign in)','Konti zo kwipimisha (kanda winjire)'],
  lang:['Language','Ururimi'], text:['Text','Inyandiko'], contrast:['Contrast','Ibara'],
  save:['Save','Bika'], cancel:['Cancel','Reka'], submit:['Submit','Ohereza'],
  officer:['Local Officer',"Umukozi w'Akarere"], beneficiary:['Beneficiary / Guardian','Uwunguka / Umurezi'],
  provider:['Support Provider','Utanga Ubufasha'], admin:['Administrator','Umuyobozi'],
  REQUESTED:['Requested','Byasabwe'], APPROVED_URGENT:['Approved · Urgent','Byemejwe · Byihutirwa'],
  APPROVED_STANDARD:['Approved · Standard','Byemejwe · Bisanzwe'], DISTRIBUTING:['Distributing','Biratangwa'],
  COMPLETED:['Completed','Byarangiye'], INELIGIBLE:['Not eligible','Ntibyemewe'],
};
const DISABILITY = {
  seeing:['Seeing','Kubona'], hearing:['Hearing','Kumva'], walking:['Walking / mobility','Kugenda'],
  cognition:['Remembering / concentrating','Kwibuka'], selfcare:['Self-care','Kwitaho'], communication:['Communication','Kuvuga'],
};
const DIFFICULTY = { some:['Some difficulty','Ingorane nkeya'], alot:['A lot of difficulty','Ingorane nyinshi'], cannot:['Cannot do at all','Ntabasha na gato'] };

const ROLES = {
  officer:    {email:'officer@kamonyi.gov.rw',  color:'var(--sky-700)',bg:'var(--sky-soft)',   ico:'🧑‍💼'},
  beneficiary:{email:'alice@beneficiary.rw',    color:'var(--green)',  bg:'var(--green-soft)', ico:'🧑‍🦯'},
  provider:   {email:'provider@ngo.rw',         color:'var(--amber)',  bg:'var(--amber-soft)', ico:'🤝'},
  admin:      {email:'admin@disability.gov.rw', color:'var(--violet)', bg:'var(--violet-soft)',ico:'🛡️'},
};
const EMAIL_TO_ROLE = Object.fromEntries(Object.entries(ROLES).map(([k,v])=>[v.email,k]));
const REQ_BADGE = {REQUESTED:'b-amber',APPROVED_URGENT:'b-red',APPROVED_STANDARD:'b-sky',DISTRIBUTING:'b-violet',COMPLETED:'b-green',INELIGIBLE:'b-gray'};
const SECTORS = ['Runda','Gacurabwenge','Musambira','Nyarubaka'];
const ME = 'B-1001'; // the signed-in demo beneficiary

/* ───────── seed data ───────── */
function seed(){
  return {
    beneficiaries:[
      {id:'B-1001',name:'Mukamana Alice',nid:'1198870...4021',sector:'Runda',cell:'Kabuga',village:'Nyakabungo',guardian:'—',email:'alice@beneficiary.rw',verified:true,
        disabilities:[{type:'seeing',level:'alot'}],
        challenges:'Cannot read printed documents; needs a guide on unfamiliar routes.',
        needs:'A white cane and orientation & mobility training.'},
      {id:'B-1002',name:'Habimana Jean',nid:'1199180...7714',sector:'Musambira',cell:'Kigusa',village:'Karambo',guardian:'Habimana Marie (mother)',email:'',verified:true,
        disabilities:[{type:'walking',level:'cannot'}],
        challenges:'Cannot walk unaided; crutches fail over long distances.',
        needs:'A wheelchair suitable for rural terrain.'},
      {id:'B-1003',name:'Uwase Claudine',nid:'1200070...1188',sector:'Gacurabwenge',cell:'Ntenyo',village:'Buhoro',guardian:'—',email:'',verified:false,
        disabilities:[{type:'hearing',level:'alot'}],
        challenges:'Cannot follow announcements at community meetings.',
        needs:'A hearing aid and follow-up fitting.'},
      {id:'B-1004',name:'Nsengimana Eric',nid:'1199560...9903',sector:'Runda',cell:'Kabuga',village:'Gitega',guardian:'—',email:'',verified:true,
        disabilities:[{type:'cognition',level:'some'}],
        challenges:'Forgets instructions quickly; needs support to learn a trade.',
        needs:'Vocational training with a patient instructor.'},
    ],
    requests:[
      {id:'R-501',benId:'B-1002',need:'A wheelchair suitable for rural terrain',origin:'officer',provider:null,status:'APPROVED_URGENT',
        reason:'Cannot walk at all and lives 6 km from the health post; escalated for priority support.',
        timeline:[{t:'Requested by officer',w:'2 days ago'},{t:'Approved — urgent, escalated for priority support (reason recorded)',w:'yesterday'}]},
      {id:'R-502',benId:'B-1004',need:'Vocational training placement',origin:'provider',provider:'Inclusive Hands NGO',status:'DISTRIBUTING',
        reason:'Recorded need matches the programme; matched with a local cooperative.',
        timeline:[{t:'Provider submitted a support offer',w:'4 days ago'},{t:'Approved — standard, queued for distribution (reason recorded)',w:'2 days ago'},{t:'Distribution started with the provider',w:'today'}]},
      {id:'R-503',benId:'B-1001',need:'White cane and mobility training',origin:'provider',provider:'Inclusive Hands NGO',status:'REQUESTED',reason:null,
        timeline:[{t:'Provider submitted a support offer',w:'today'}]},
      {id:'R-504',benId:'B-1003',need:'Hearing aid',origin:'officer',provider:null,status:'COMPLETED',
        reason:'Eligible; device available from the district stock.',
        timeline:[{t:'Requested by officer',w:'1 month ago'},{t:'Approved — standard (reason recorded)',w:'3 weeks ago'},{t:'Delivery confirmed — support history stored',w:'20 days ago'}]},
    ],
    opportunities:[
      {id:'O-01',kind:'scholarship',title:'Bursary for students with disabilities',org:'NCPD',detail:'Full bursary covering tuition and materials at technical schools.',w:'today'},
      {id:'O-02',kind:'job',title:'Reception assistant (accessible office)',org:'Kamonyi District',detail:'Ground-floor post suitable for applicants with mobility impairments.',w:'3 days ago'},
      {id:'O-03',kind:'training',title:'Digital skills training',org:'Inclusive Tech Rwanda',detail:'Basic computer training, including screen readers.',w:'1 week ago'},
    ],
    corrections:[{id:'C-01',benId:'B-1001',text:'My village is recorded as Nyakabungo, but it is Gasharu.',field:'village',value:'Gasharu',status:'pending',w:'yesterday'}],
    users:[
      {name:'Officer Uwimana',email:'officer@kamonyi.gov.rw',role:'officer',scope:'Kamonyi District'},
      {name:'Mukamana Alice',email:'alice@beneficiary.rw',role:'beneficiary',scope:'B-1001'},
      {name:'Inclusive Hands NGO',email:'provider@ngo.rw',role:'provider',scope:'NGO'},
      {name:'System Admin',email:'admin@disability.gov.rw',role:'admin',scope:'NCPD'},
    ],
    notifs:[
      {to:'B-1001',ico:'🦯',t:'A support offer (white cane) was submitted for you — under review.',w:'today'},
      {to:'B-1001',ico:'🎓',t:'New bursary published — see Opportunities.',w:'yesterday'},
    ],
    audit:[
      {who:'Officer Uwimana',a:'Registered beneficiary B-1004 (Nsengimana Eric)',w:'2 days ago'},
      {who:'Officer Uwimana',a:'Decided R-501 → APPROVED_URGENT (reason recorded)',w:'yesterday'},
      {who:'System',a:'Credentials emailed for B-1001',w:'1 month ago'},
    ],
  };
}
let BID=1004, RID=504, OID=3, CID=1;

/* ───────── engine (all state transitions live here) ───────── */
function useEngine(){
  const [db,setDb]=useState(seed);
  const [toast,setToast]=useState('');
  const say=m=>{setToast(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(''),3000)};
  const audit=(who,a)=>setDb(d=>({...d,audit:[{who,a,w:'just now'},...d.audit]}));
  const push=(to,ico,t)=>setDb(d=>({...d,notifs:[{to,ico,t,w:'just now'},...d.notifs]}));
  const benOf=id=>db.beneficiaries.find(b=>b.id===id);

  const findDuplicates=(f)=>db.beneficiaries.filter(b=>
    (f.nid&&b.nid===f.nid.trim())||(f.name&&f.sector&&b.name.toLowerCase()===f.name.trim().toLowerCase()&&b.sector===f.sector));

  function registerBeneficiary(f){
    const id='B-'+(++BID);
    setDb(d=>({...d,beneficiaries:[{...f,id,name:f.name.trim(),verified:true},...d.beneficiaries]}));
    audit('Officer Uwimana',`Registered beneficiary ${id} (${f.name.trim()})`);
    if(f.email){audit('System',`Credentials emailed for ${id}`);push(id,'📧','Your record was registered and your account created.');}
    return id;
  }
  const updateBeneficiary=(id,patch,note)=>{
    setDb(d=>({...d,beneficiaries:d.beneficiaries.map(b=>b.id===id?{...b,...patch}:b)}));
    audit('Officer Uwimana',note||`Updated record ${id}`);
  };
  function createRequest(benId,need,origin,provider){
    const id='R-'+(++RID);
    setDb(d=>({...d,requests:[{id,benId,need,origin,provider:provider||null,status:'REQUESTED',reason:null,
      timeline:[{t:origin==='provider'?'Provider submitted a support offer':'Requested by officer',w:'just now'}]},...d.requests]}));
    audit(origin==='provider'?'Inclusive Hands NGO':'Officer Uwimana',`Created support request ${id} for ${benId}`);
    push(benId,'🤝','A support request was created for you — it is under review.');
    say(origin==='provider'?`Offer ${id} submitted — the officer will review it`:`Support request ${id} created`);
  }
  const DEC={urgent:['APPROVED_URGENT','Approved — urgent, escalated for priority support'],
             standard:['APPROVED_STANDARD','Approved — standard, queued for distribution'],
             ineligible:['INELIGIBLE','Recorded as not eligible — beneficiary notified with the reason']};
  function decide(id,decision,reason){
    const [status,label]=DEC[decision];
    const r=db.requests.find(x=>x.id===id);
    setDb(d=>({...d,requests:d.requests.map(x=>x.id===id?{...x,status,reason,timeline:[...x.timeline,{t:`${label} (reason recorded)`,w:'just now'}]}:x)}));
    audit('Officer Uwimana',`Decided ${id} → ${status} (reason recorded)`);
    push(r.benId,decision==='ineligible'?'ℹ️':'✅',decision==='ineligible'?`Support request not approved. Reason: ${reason}`:'Your support request was approved.');
    say(`${id} — decision recorded`);
  }
  function advance(id,status,label,ico,msg){
    const r=db.requests.find(x=>x.id===id);
    setDb(d=>({...d,requests:d.requests.map(x=>x.id===id?{...x,status,timeline:[...x.timeline,{t:label,w:'just now'}]}:x)}));
    audit('Officer Uwimana',`${id} → ${status}`);push(r.benId,ico,msg);say(`${id} — ${status.toLowerCase()}`);
  }
  const distribute=id=>advance(id,'DISTRIBUTING','Distribution started with the provider','📦','Your support is being distributed.');
  const complete=id=>advance(id,'COMPLETED','Delivery confirmed — support history stored','🎉','Your support has been delivered and recorded.');

  function requestCorrection(benId,text){
    const id='C-'+(++CID);
    setDb(d=>({...d,corrections:[{id,benId,text,field:null,value:null,status:'pending',w:'just now'},...d.corrections]}));
    audit('Mukamana Alice',`Correction requested for ${benId}`);
    say('Correction request sent to your officer');
  }
  // Applying a correction really changes the official record — the officer
  // states which field and what it becomes, and the change is audited.
  function applyCorrection(id,field,value){
    const c=db.corrections.find(x=>x.id===id);
    setDb(d=>({...d,
      corrections:d.corrections.map(x=>x.id===id?{...x,status:'applied',field,value}:x),
      beneficiaries:d.beneficiaries.map(b=>b.id===c.benId?{...b,[field]:value}:b)}));
    audit('Officer Uwimana',`Correction ${id} applied to ${c.benId} (${field} → ${value})`);
    push(c.benId,'✏️',`Your correction was applied: ${field} is now "${value}".`);
    say(`Record ${c.benId} updated — ${field} → ${value}`);
  }
  function resolveCorrection(id,apply){
    const c=db.corrections.find(x=>x.id===id);
    setDb(d=>({...d,corrections:d.corrections.map(x=>x.id===id?{...x,status:apply?'applied':'declined'}:x)}));
    audit('Officer Uwimana',`Correction ${id} ${apply?'applied':'declined'}`);
    push(c.benId,'✏️',apply?'Your correction was applied to your record.':'Your correction request was reviewed and declined.');
    say(`Correction ${apply?'applied':'declined'}`);
  }
  function publishOpportunity(o){
    const id='O-'+(++OID);
    setDb(d=>({...d,opportunities:[{...o,id,w:'just now'},...d.opportunities],
      notifs:[...d.beneficiaries.map(b=>({to:b.id,ico:{scholarship:'🎓',job:'💼',training:'📚',announcement:'📣'}[o.kind],t:`New ${o.kind}: ${o.title}`,w:'just now'})),...d.notifs]}));
    audit(o.org||'—',`Published ${o.kind}: ${o.title}`);
    say('Published — every registered beneficiary was notified');
  }
  return {db,toast,say,benOf,findDuplicates,registerBeneficiary,updateBeneficiary,createRequest,decide,distribute,complete,requestCorrection,applyCorrection,resolveCorrection,publishOpportunity};
}

function A11yBar({a,setA,t}){
  return <div className="a11y" role="region" aria-label="Accessibility settings">
    <span className="lbl">🌐 {t('lang')}</span>
    <div className="grp">{['en','rw'].map(l=><button key={l} className={a.lang===l?'on':''} onClick={()=>setA({...a,lang:l})} aria-pressed={a.lang===l}>{l.toUpperCase()}</button>)}</div>
    <span className="lbl">🔠 {t('text')}</span>
    <div className="grp">
      <button onClick={()=>setA({...a,zoom:Math.max(1,+(a.zoom-0.1).toFixed(2))})} aria-label="Decrease text size">A−</button>
      <button onClick={()=>setA({...a,zoom:1})} aria-label="Reset text size">A</button>
      <button onClick={()=>setA({...a,zoom:Math.min(1.5,+(a.zoom+0.1).toFixed(2))})} aria-label="Increase text size" style={{fontSize:16}}>A+</button>

function Tabs({tabs,active,set}){return <div className="tabs" role="tablist">{tabs.map(x=>(

function Empty({title,sub}){return <div className="empty"><b>{title}</b>{sub}</div>}
function Timeline({items}){return <div className="tl">{items.map((it,i)=><div key={i} className="tl-item"><div className="tl-t">{it.t}</div><div className="tl-w">{it.w}</div></div>)}</div>}
function ReqBadge({status,t}){return <span className={"badge "+(REQ_BADGE[status]||'b-gray')}><span className="dot"/>{t(status)}</span>}
function Tags({list,t}){return <>{list.map((d,i)=><span key={i} className="badge b-sky" style={{marginRight:6,marginBottom:4}}><span className="dot"/>{t.d(d.type)} · {t.diff(d.level)}</span>)}</>}

function RegisterForm({eng,t,goto}){
  const blank={name:'',nid:'',sector:SECTORS[0],cell:'',village:'',guardian:'',email:'',challenges:'',needs:'',consent:false,
    disabilities:[{type:'seeing',level:'some'}]};
  const [f,setF]=useState(blank);
  const [err,setErr]=useState('');
  const [dups,setDups]=useState(null);   // null = not checked; [] = none; [..] = candidates
  const [done,setDone]=useState(null);
  const up=k=>e=>setF({...f,[k]:e.target.value});
  const setDis=(i,k,v)=>setF({...f,disabilities:f.disabilities.map((d,j)=>j===i?{...d,[k]:v}:d)});
  const addDis=()=>setF({...f,disabilities:[...f.disabilities,{type:'hearing',level:'some'}]});
  const delDis=i=>setF({...f,disabilities:f.disabilities.filter((_,j)=>j!==i)});

  // force = the officer explicitly chose to register despite a duplicate
  function attempt(force){
    setErr('');
    if(!f.name.trim()||!f.sector){setErr(t.x('Full name and sector are required.','Izina n\'umurenge birakenewe.'));return;}
    if(!f.needs.trim()){setErr(t.x('Support needs are required — a disability category alone cannot say what a person needs.','Ubufasha akeneye burakenewe.'));return;}
    if(!f.disabilities.length){setErr(t.x('Record at least one impairment.','Andika nibura ubumuga bumwe.'));return;}
    if(!f.consent){setErr(t.x('Informed consent is required before storing sensitive disability data (Law No. 058/2021).','Uruhushya rurakenewe (Itegeko 058/2021).'));return;}
    if(!force){
      const found=eng.findDuplicates(f);
      if(found.length){setDups(found);return;}
    }
    const id=eng.registerBeneficiary(f);
    setDone({id,email:f.email});
    eng.say(`${id} registered${f.email?' — credentials emailed':''}`);
  }
  if(done)return <div className="success">
    <div className="big">📧</div>
    <div style={{fontWeight:800,fontSize:18,marginTop:6}}>{t.x('Beneficiary registered','Uwunguka yanditswe')}</div>
    <div className="code" style={{fontSize:22,margin:'8px 0'}}>{done.id}</div>
    <div style={{color:'var(--muted)',lineHeight:1.5}}>{done.email
      ? <>{t.x('Account created; login credentials emailed to','Konti yakozwe; imyirondoro yoherejwe kuri')} <b>{done.email}</b>.</>
      : <>{t.x('No email address recorded — guardian- and officer-mediated access apply. This is a legitimate path, not a failure.','Nta imeyili — bizanyura ku murezi cyangwa umukozi.')}</>}</div>
    <div className="row-actions" style={{justifyContent:'center',marginTop:16}}>
      <button className="btn" onClick={goto}>{t.x('Open registry','Fungura registry')}</button>
      <button className="btn ghost" onClick={()=>{setF(blank);setDups(null);setDone(null);setErr('')}}>{t.x('Register another','Andika undi')}</button>
    </div></div>;
  return <div className="card" style={{marginTop:22,maxWidth:780}}>
    <div className="card-t">{t.x('Register a beneficiary','Andika uwunguka')}</div>
    <small className="hint">{t.x('Record the impairment, the daily challenges and the support needs separately — a category alone cannot express what a person actually requires.','Andika ubumuga, ingorane n\'ubufasha bukenewe ukwabyo.')}</small>
    <div className="form-grid">
      <div><label>{t.x('Full name','Amazina')} *</label><input className="input" value={f.name} onChange={up('name')}/></div>
      <div><label>{t.x('National ID','Indangamuntu')}</label><input className="input" value={f.nid} onChange={up('nid')}/></div>
      <div><label>{t.x('Sector','Umurenge')} *</label><select className="input" value={f.sector} onChange={up('sector')}>{SECTORS.map(s=><option key={s}>{s}</option>)}</select></div>
      <div><label>{t.x('Cell','Akagari')}</label><input className="input" value={f.cell} onChange={up('cell')}/></div>
      <div><label>{t.x('Village','Umudugudu')}</label><input className="input" value={f.village} onChange={up('village')}/></div>
      <div><label>{t.x('Guardian (if any)','Umurezi')}</label><input className="input" value={f.guardian} onChange={up('guardian')}/></div>
      <div className="full"><label>{t.x('Email for login credentials (optional)','Imeyili yo kohererezwaho konti')}</label>
        <input className="input" value={f.email} onChange={up('email')} placeholder={t.x('Leave empty if none — mediated access applies','Siga ubusa niba nta yo ihari')}/></div>
    </div>
    <div style={{marginTop:18}}>
      <label style={{fontWeight:700,fontSize:14}}>{t.x('Impairment (Washington Group Short Set)','Ubumuga (Washington Group)')} *</label>
      {f.disabilities.map((d,i)=><div className="wg" key={i}>
        <select className="input" value={d.type} onChange={e=>setDis(i,'type',e.target.value)} aria-label="Impairment type">{Object.keys(DISABILITY).map(k=><option key={k} value={k}>{t.d(k)}</option>)}</select>
        <select className="input" value={d.level} onChange={e=>setDis(i,'level',e.target.value)} aria-label="Difficulty level">{Object.keys(DIFFICULTY).map(k=><option key={k} value={k}>{t.diff(k)}</option>)}</select>
        {f.disabilities.length>1
          ?<button className="btn red sm" onClick={()=>delDis(i)} aria-label="Remove impairment">✕</button>
          :<span/>}
      </div>)}
      <button className="btn ghost sm" style={{marginTop:8}} onClick={addDis}>+ {t.x('Add impairment','Ongeraho')}</button>
    </div>
    <div className="form-grid">
      <div className="full"><label>{t.x('Daily challenges','Ingorane za buri munsi')}</label><textarea className="input" value={f.challenges} onChange={up('challenges')} placeholder={t.x('What does this person struggle with day to day?','Ni izihe ngorane afite?')}/></div>
      <div className="full"><label>{t.x('Support needs','Ubufasha akeneye')} *</label><textarea className="input" value={f.needs} onChange={up('needs')} placeholder={t.x('What would actually help?','Ni ubuhe bufasha bwamufasha?')}/></div>
    </div>
    <label className="consent"><input type="checkbox" checked={f.consent} onChange={e=>{setF({...f,consent:e.target.checked});setErr('')}}/>
      <span>{t.x('The beneficiary (or guardian) has given informed consent to store this sensitive data, under Law No. 058/2021 on the protection of personal data and privacy.','Uwunguka cyangwa umurezi yatanze uruhushya rwo kubika aya makuru y\'ibanga (Itegeko 058/2021).')}</span></label>
    {err&&<div className="warn" role="alert">{err}</div>}
    {dups&&dups.length>0&&<div className="warn" role="alert">
      <b>{t.x('Possible duplicate detected','Hari uwo asa nawe')}:</b>
      <div style={{marginTop:6}}>{dups.map(d=><div key={d.id}>• {d.name} <span className="code">{d.id}</span> — {d.sector}, {d.village}</div>)}</div>
      <div style={{marginTop:8}}>{t.x('The registry is meant to hold one record per person. Register anyway only if this is genuinely a different person.','Registry igomba kugira inyandiko imwe kuri buri muntu.')}</div>
      <div className="row-actions">
        <button className="btn amber sm" onClick={()=>attempt(true)}>{t.x('Register anyway','Komeza wandike')}</button>
        <button className="btn ghost sm" onClick={()=>setDups(null)}>{t.x('Go back and edit','Subira usubiremo')}</button>
      </div></div>}
    <button className="btn block" style={{marginTop:16}} onClick={()=>attempt(false)}>{t.x('Register & email credentials','Andika wohereze konti')}</button>
  </div>;
}

        {err&&<div className="err" role="alert">{err}</div>}</div>
      <div className="row-actions">

function Reports({eng,t}){
  const B=eng.db.beneficiaries,R=eng.db.requests;
  const EST=2400; // Table 3: estimated PwD population in the study area
  const coverage=+(B.length/EST*100).toFixed(1);
  const completeness=B.length?Math.round(B.filter(b=>b.sector&&b.challenges&&b.needs).length/B.length*100):0;
  const decided=R.filter(r=>r.status!=='REQUESTED');
  const traceability=decided.length?Math.round(decided.filter(r=>r.reason&&r.reason.trim()).length/decided.length*100):0;
  const seen={};let dup=0;B.forEach(b=>{const k=b.nid||b.name+'|'+b.sector;if(seen[k])dup++;else seen[k]=1});
  const dupPct=B.length?+(dup/B.length*100).toFixed(1):0;
  const delivered=R.filter(r=>r.status==='COMPLETED').length;
  const byType={};B.forEach(b=>b.disabilities.forEach(d=>byType[d.type]=(byType[d.type]||0)+1));
  const bySector={};B.forEach(b=>bySector[b.sector]=(bySector[b.sector]||0)+1);
  return <>
    <div className="stats">
      <div className="stat"><div className="stat-l">{t.x('Registered','Abanditswe')}</div><div className="stat-v">{B.length}</div></div>
      <div className="stat"><div className="stat-l">{t.x('Coverage of est. population','Coverage')}</div><div className="stat-v">{coverage}%</div></div>
      <div className="stat"><div className="stat-l">{t.x('Record completeness','Byuzuye')}</div><div className="stat-v">{completeness}%</div></div>
      <div className="stat"><div className="stat-l">{t.x('Duplication rate','Duplication')}</div><div className="stat-v">{dupPct}%</div></div>
      <div className="stat"><div className="stat-l">{t.x('Support delivered','Bwatanzwe')}</div><div className="stat-v">{delivered}</div></div>
      <div className="stat"><div className="stat-l">{t.x('Decisions with a reason','Ifite impamvu')}</div><div className="stat-v">{traceability}%</div></div>
    </div>
    <div className="grid g2">
      <div className="card"><div className="card-t">{t.x('By impairment type','Ku bwoko bw\'ubumuga')}</div>
        <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:10}}>{Object.keys(DISABILITY).map(k=>{
          const n=byType[k]||0;const pct=B.length?Math.round(n/B.length*100):0;
          return <div key={k}><div style={{display:'flex',justifyContent:'space-between',fontSize:13.5,marginBottom:4}}>
            <span style={{color:'var(--muted)'}}>{t.d(k)}</span><b>{n}</b></div><div className="bar"><i style={{width:pct+'%'}}/></div></div>})}</div></div>
      <div className="card"><div className="card-t">{t.x('Support requests by status','Ibyifuzo mu byiciro')}</div>
        <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:10}}>{Object.keys(REQ_BADGE).map(k=>{
          const n=R.filter(r=>r.status===k).length;const pct=R.length?Math.round(n/R.length*100):0;
          return <div key={k}><div style={{display:'flex',justifyContent:'space-between',fontSize:13.5,marginBottom:4}}>
            <span style={{color:'var(--muted)'}}>{t(k)}</span><b>{n}</b></div><div className="bar"><i style={{width:pct+'%'}}/></div></div>})}</div></div>
      <div className="card"><div className="card-t">{t.x('Coverage by sector','Ku murenge')}</div>
        <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:10}}>{SECTORS.map(s=>{
          const n=bySector[s]||0;const pct=B.length?Math.round(n/B.length*100):0;
          return <div key={s}><div style={{display:'flex',justifyContent:'space-between',fontSize:13.5,marginBottom:4}}>
            <span style={{color:'var(--muted)'}}>{s}</span><b>{n}</b></div><div className="bar"><i style={{width:pct+'%'}}/></div></div>})}</div></div>
      <div className="card"><div className="card-t">{t.x('What these numbers answer','Icyo imibare isobanura')}</div>
        <div style={{marginTop:10,fontSize:13.5,lineHeight:1.6,color:'var(--muted)'}}>
          <b style={{color:'var(--text)'}}>{t.x('Coverage','Coverage')}</b> — {t.x('whether the registry finds the people it exists to serve.','niba registry ibona abo igenewe.')}<br/>
          <b style={{color:'var(--text)'}}>{t.x('Duplication','Duplication')}</b> — {t.x('whether it is a single authoritative record.','niba ari inyandiko imwe yemewe.')}<br/>
          <b style={{color:'var(--text)'}}>{t.x('Traceability','Traceability')}</b> — {t.x('whether support can be shown to be fair rather than merely asserted.','niba ubufasha bugaragara ko ari ubutabera.')}
        </div></div>
    </div>
  </>;
}

/* ═══════════ ROOT ═══════════ */
function App(){
  const [role,setRole]=useState(null);
  const [a,setA]=useState({lang:'en',zoom:1,hc:false});
  const eng=useEngine();
  React.useEffect(()=>{document.body.classList.toggle('hc',a.hc)},[a.hc]);

  const i=a.lang==='rw'?1:0;
  const t=(k)=>T[k]?T[k][i]:k;
  t.x=(en,rw)=>a.lang==='rw'?rw:en;
  t.d=(k)=>DISABILITY[k]?DISABILITY[k][i]:k;
  t.diff=(k)=>DIFFICULTY[k]?DIFFICULTY[k][i]:k;

  if(!role)return <Login onLogin={setRole} a={a} setA={setA} t={t}/>;
  return <Shell role={role} onLogout={()=>setRole(null)} a={a} setA={setA} t={t}>
    {role==='officer'&&<Officer eng={eng} t={t}/>}
    {role==='beneficiary'&&<Beneficiary eng={eng} t={t}/>}
    {role==='provider'&&<Provider eng={eng} t={t}/>}
    {role==='admin'&&<Admin eng={eng} t={t}/>}
    {eng.toast&&<div className="toast" role="status">✓ {eng.toast}</div>}
  </Shell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
